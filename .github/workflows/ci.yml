name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Conformance suite on HalAdapter
        run: >
          python -c "from vsl_core.conformance.suite import run_conformance_suite as r;
          from hal9000.adapter import HalAdapter as A;
          f = r(A('hal9000-ci')); print(f); raise SystemExit(bool(f))"
      - run: python scripts/run_ungoverned.py
      - run: python scripts/run_governed.py
      - run: python scripts/tamper_demo.py
